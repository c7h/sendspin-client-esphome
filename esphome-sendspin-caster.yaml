esphome:
  name: esphome-sendspin-caster

esp32:
  variant: esp32
  framework:
    type: esp-idf

psram:
  mode: quad

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  id: es8388_i2c
  sda: GPIO23
  scl: GPIO22
  frequency: 100kHz

audio_dac:
  - platform: es8388
    id: es8388_dac
    i2c_id: es8388_i2c
    address: 0x10

select:
  - platform: es8388
    es8388_id: es8388_dac
    dac_output:
      name: ES8388 DAC output
      initial_option: BOTH

i2s_audio:
  - id: es8388_i2s
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0

speaker:
  - platform: i2s_audio
    id: es8388_speaker
    dac_type: external
    i2s_audio_id: es8388_i2s
    i2s_dout_pin: GPIO2
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    i2s_mode: primary
    i2s_comm_fmt: stand_i2s
    use_apll: false
    audio_dac: es8388_dac

sendspin:
  id: sendspin_hub
  manufacturer: DIY
  model: ESP32-caster

media_source:
  - platform: sendspin
    id: sendspin_media_source
    sample_rate: 48000
    codecs: [flac, pcm]
    buffer_size: 524288
    task_stack_in_psram: true
    decode_memory: psram
    initial_static_delay: 0ms
    static_delay_adjustable: true

media_player:
  - platform: speaker_source
    id: sendspin_media_player
    media_pipeline:
      speaker: es8388_speaker
      format: FLAC
      num_channels: 2
      sources:
        - sendspin_media_source

